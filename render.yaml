# Render Blueprint: one Docker web service (API + WebSockets + built SPA, same origin)
# plus a private Postgres: live-room snapshots (games survive restarts), accounts, coins, seasons, stats.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. SECRET_KEY is generated for you.
databases:
  - name: snazzlebop-db
    # Paid (about $6/month, 1 GB storage included): the free Postgres expires, and accounts, coins and
    # restart-proof rooms live here. Games still run if the database is ever unreachable.
    plan: 0.1c-256mb
    databaseName: snazzlebop
    user: snazzlebop
    ipAllowList: [] # private network only: no public access to the database

services:
  - type: web
    name: snazzlebop
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter # always on; the free plan sleeps when idle and drops live rooms
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: snazzlebop-db
          property: connectionString
      # Render's edge is Cloudflare, which overwrites cf-connecting-ip with the real client address
      # on every request. X-Forwarded-For there ends in a shared Cloudflare edge IP, so it must not
      # be used for rate limits.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # Optional fresh content from Claude. Set the value in the Render dashboard; never in git.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional voice and video calls (LiveKit Cloud: Settings > Keys). All three, or calls stay off.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # The jump-scare prank: only the names in JUMPSCARE_NAMES (comma list, dashboard only) are
      # pranked; with none set nobody is. JUMPSCARE=false turns it off entirely.
      - key: JUMPSCARE
        sync: false
      - key: JUMPSCARE_NAMES
        sync: false
      # RENDER_EXTERNAL_HOSTNAME is provided by Render and is added to the host/origin allowlists.
      # For a custom domain also set ALLOWED_HOSTS and ALLOWED_ORIGINS (comma separated).
