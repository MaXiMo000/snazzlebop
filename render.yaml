# Render Blueprint: one Docker web service (API + WebSockets + built SPA, same origin)
# plus a private Postgres for anonymous game stats.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. SECRET_KEY is generated for you.
databases:
  - name: snazzlebop-db
    plan: free # NOTE: Render's free Postgres expires after a while; the game keeps working without it.
    databaseName: snazzlebop
    user: snazzlebop
    ipAllowList: [] # private network only: no public access to the database

services:
  - type: web
    name: snazzlebop
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free # Free instances sleep when idle and drop live rooms. Use "starter" for real use.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: snazzlebop-db
          property: connectionString
      # Render's edge is Cloudflare, which overwrites cf-connecting-ip with the real client address
      # on every request. X-Forwarded-For there ends in a shared Cloudflare edge IP, so it must not
      # be used for rate limits (verified live, see docs/SECURITY-EVIDENCE.md).
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # Optional fresh content from Claude. Set the value in the Render dashboard; never in git.
      - key: ANTHROPIC_API_KEY
        sync: false
      # RENDER_EXTERNAL_HOSTNAME is provided by Render and is added to the host/origin allowlists.
      # For a custom domain also set ALLOWED_HOSTS and ALLOWED_ORIGINS (comma separated).
