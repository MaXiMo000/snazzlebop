# Alembic: schema migrations for the app's database. The app runs them itself at startup
# (app.db.Database.init); this file is for the command line, e.g.
#   alembic revision --autogenerate -m "add clubs"   (DATABASE_URL from the environment)
#   alembic upgrade head / alembic downgrade -1 / alembic check
[alembic]
script_location = %(here)s/app/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
