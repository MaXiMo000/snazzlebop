name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: catch newly disclosed dependency vulnerabilities

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every `uses:` is pinned to a full commit SHA (tag in the comment); Dependabot bumps them.
# Docker images are pinned by digest.
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: ruff check --config pyproject.toml ../scripts && ruff format --check --config pyproject.toml ../scripts
      - run: bandit -q -r app -c pyproject.toml
      - run: pip-audit --require-hashes --disable-pip -r requirements.lock
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run contrast # every text/background pair >= 4.5:1
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - run: docker build -t snazzlebop:ci .
      - name: Scan image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa             image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 snazzlebop:ci # v0.75.0
      - name: Smoke test
        run: |
          # No proxy in front of the CI container, so trust no X-Forwarded-For hops.
          docker run -d --name snazzlebop -p 10000:10000 \
            -e ENV=production -e SECRET_KEY=$(python3 -c "import secrets;print(secrets.token_urlsafe(48))") \
            -e ALLOWED_HOSTS=localhost -e ALLOWED_ORIGINS=http://localhost:10000 -e TRUSTED_PROXY_HOPS=0 \
            -e DATABASE_URL=sqlite+aiosqlite:///./ci.db snazzlebop:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:10000/healthz && break || sleep 1; done
          curl -fsSI http://localhost:10000/ | grep -i "content-security-policy"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/docs)" = 404
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: Simulate full games against the container (scores move, secrets never leak)
        run: |
          pip install "httpx==0.28.1" "websockets==17.1"
          python scripts/simulate.py --base http://localhost:10000 --bots 5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright smoke (mobile 390px + desktop) against the container
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Screenshots for visual QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-screenshots
          path: |
            frontend/e2e/screenshots/
            frontend/test-results/
            frontend/lighthouse/
          if-no-files-found: ignore
      - name: Lighthouse gate (a11y / best practices / SEO >= 95, mobile + desktop)
        working-directory: frontend
        run: bash scripts/lighthouse.sh snazzlebop
      - name: OWASP ZAP baseline (fails on any FAIL; informational warnings documented in SECURITY-EVIDENCE.md)
        run: |
          docker run --rm --network host \
            ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-baseline.py -t http://localhost:10000 -I
      - name: Container logs (should hold no names, tokens or room codes)
        if: always()
        run: docker logs snazzlebop

  abuse:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Abuse suite (Locust) on a private Docker network
        run: bash scripts/loadtest/run.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52  # v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52  # v3
